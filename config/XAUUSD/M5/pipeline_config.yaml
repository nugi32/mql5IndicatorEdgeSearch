# Pipeline Configuration for edge_research -- M5 profile
#
# ASSUMPTION THIS FILE IS BUILT ON: dataset size of roughly 400,000
# bars (~5 years of continuous M5). This is a ballpark, not your actual file size.
#
# ACTION REQUIRED BEFORE TRUSTING RESULTS FROM THIS PROFILE:
# After Phase 1 runs, check the log line:
#   "Ingestion complete: N bars loaded"
# If your actual N differs a lot from 400,000, rescale the three
# wf_* values below using the same ratio this file uses:
#   wf_train_bars  ~= 0.35 * N
#   wf_test_bars   ~= 0.07 * N
#   wf_step_bars   ~= 0.035 * N
# (this ratio produces multiple valid walk-forward windows (17, verified) on the real
# 4123-bar XAUUSD D1 smoke test -- see PROJECT_DIRECTION.md section 10)
# The pipeline now warns loudly at [PHASE 7] if wf_train_bars + wf_test_bars
# doesn't fit inside your actual bar count, so a bad guess here won't fail
# silently -- but rescaling correctly still gives more walk-forward windows
# and a more reliable robust_walk_forward signal than relying on the warning
# and having the gate reject everything.

# Forward-looking horizon parameters
max_horizon: 100                   # Maximum bars to look ahead (1 to 100)
min_horizon: 1                     # Minimum bars (always 1)

# Frequency filtering
# min_occurrence / min_freq_per_year scaled up a bit vs the original D1
# defaults for lower/faster timeframes, since a much larger raw sample size
# is available -- this keeps "50 occurrences" from being a trivially easy
# bar to clear on M1/M5 just because there are millions of bars to trigger
# on. Tune down if this filters out too much on your actual dataset.
min_occurrence: 150
min_freq_per_year: 30.0

# Statistical significance
alpha: 0.05                        # Significance level for hypothesis tests
fdr_method: "fdr_bh"               # Benjamini-Hochberg FDR correction

# Walk-forward validation -- sized for ~400,000 bars (~5 years of continuous M5).
# See the ACTION REQUIRED note above if your actual bar count is different.
wf_train_bars: 388000   # ~0.35 * N (N ≈ 1,109,030 M5 bars for the full 2010-2025 XAUUSD export)
wf_test_bars:  78000    # ~0.07 * N
wf_step_bars:  39000    # ~0.035 * N

# Regime classification
atr_percentile_low: 25             # ATR < 25th percentile = low vol
atr_percentile_high: 75            # ATR > 75th percentile = high vol

adx_trending_threshold: 25         # ADX > 25 = trending regime
adx_ranging_threshold: 20          # ADX < 20 = ranging regime

# Parameter sensitivity
param_shift_pct: 15                # +/-15% parameter shift for sensitivity test

# Cost model (entry and exit) -- FOREX DEFAULTS (5-digit quoting).
# IMPORTANT: these are timeframe-independent but SYMBOL-dependent. The
# values below are correct for majors like EURUSD/GBPUSD. For XAUUSD or
# any non-forex instrument, override pip_value and spread_pips so that
# spread_pips * pip_value matches that symbol's real spread in price units
# (e.g. for XAUUSD: pip_value: 0.01, spread_pips: 30.0  ->  0.3 price units,
# per the discussion in PROJECT_DIRECTION.md section 10). Getting this
# wrong doesn't break the pipeline, but it silently makes Phase 7c's
# simulated expectancy_r unrealistically optimistic (near-zero cost) or
# unrealistically pessimistic (cost way too high).
spread_pips: 30.0                   # Spread in pips
slippage_pips: 1.0                 # Slippage in pips (on entry and exit)
pip_value: 0.01                    # Pip value -- FIXED: was 0.0001 (forex default) which made spread_pips*pip_value = 0.003 price units instead of the intended 0.3 for XAUUSD, silently near-zero-cost

# Holdout set
holdout_pct: 0.15                  # Reserve 15% of data as final untouched test set

# Trade simulation (Phase 7c)
sim_atr_column: "atr_14"

# Holding-period selection (Phase 7c, extended) -- replaces the old
# SL/TP/trailing-stop exit scheme entirely. simulate_condition() now has
# exactly one exit mechanism: close unconditionally holding_bars bars after
# entry. holding_bars itself is NOT set here -- it is selected per-condition
# by scan_holding_horizons()/select_best_holding_bars() (the horizon with the
# best consistency score, mean_r / (std_r / sqrt(n)), not the biggest raw
# mean_r) within the range below.
horizon_scan_min_bars: 1              # smallest holding period (bars) scanned per condition
horizon_scan_max_bars: 100            # largest holding period (bars) scanned per condition -- defaults to max_horizon

# How many walk-forward windows the selected holding_bars must show a
# positive mean R-multiple in (out-of-sample) to be accepted as
# 'holding_bars_stable' -- see strategy_gate.py gate 8. Raise this for a
# stricter, more conservative selection; 1 is the permissive floor.
horizon_min_stable_windows: 1

# Rotation permutation test (Phase 7d)
permutation_n: 500
# permutation_random_state: 42     # uncomment for reproducible runs

# Final strategy selection gate (Phase 7e)
gate_min_sim_trades: 30
gate_min_profit_factor: 1.1
gate_require_walk_forward: true
gate_require_permutation: true


# --- Cost realism & validation hardening (added this revision) ---------
# See PROJECT_DIRECTION.md section 8 ("Suggested next steps / future
# work") and the "kenapa lolos di Python tapi gagal di MQL5" discussion.
# All of these are OPT-IN and default to behavior identical to before this
# revision if left commented out / omitted.

# Phase 6b: cost-aware pre-filter. Drops significant conditions whose
# cost-adjusted expectancy_r (using the same simple horizon-based cost
# model as Phase 5-6, no SL/TP) doesn't clear this margin, BEFORE they pay
# for the expensive Phase 7 robustness stack. 0.0 = "must not already be
# underwater on the cheap estimate". Set precheck_enabled: false to
# disable this phase entirely.
precheck_enabled: true
min_precheck_expectancy_r: 0.0

# Variable/volatility-aware spread (Phase 5-6 cost model AND Phase 7c trade
# simulation). When set, spread for each triggered bar/trade is computed
# as `spread_atr_mult * atr_at_entry` (price units) instead of the fixed
# spread_pips/spread_price_units above -- this makes cost scale with the
# market's own realized volatility at entry time rather than assuming a
# constant spread across the whole dataset. Leave commented out to keep
# the fixed-spread behavior.
# spread_atr_mult: 0.03

# Optional session-based spread multiplier on top of the fixed or
# ATR-scaled spread above. List of [start_hour, end_hour, multiplier]
# triples in broker/server time (same timezone the data was exported in --
# no conversion is done). A range may wrap past midnight, e.g. [22, 6, x]
# covers 22:00-23:59 and 00:00-05:59. Example below widens spread during
# the low-liquidity Asia session and tightens it during the London/NY
# overlap -- tune to your broker's actual observed spread behavior before
# relying on it.
# session_spread_multipliers:
#   - [0, 7, 1.5]     # Asia session -- wider spread
#   - [7, 16, 1.0]    # London session -- baseline
#   - [13, 16, 0.9]   # London/NY overlap -- tightest
#   - [16, 24, 1.1]   # NY session tail -- slightly wider

# Bootstrap confidence interval on Phase 7c's expectancy_r. Off by default
# (sim_bootstrap_n: 0) since it adds compute cost per condition. When
# enabled, gate_require_positive_ci_lower can require the CI LOWER bound
# (not just the point estimate) to be positive in Phase 7e -- stricter
# than the existing sim_expectancy_positive gate, since it accounts for
# trade-to-trade variance and small sample sizes.
sim_bootstrap_n: 0
sim_bootstrap_ci: 0.95
# sim_bootstrap_random_state: 42   # uncomment for reproducible CIs
gate_require_positive_ci_lower: false

# Condition generation
rsi_thresholds: [20, 25, 30, 35, 70, 75, 80]
cci_thresholds: [-100, -50, 50, 100]
mom_thresholds: [-5, 0, 5]
stoch_thresholds: [20, 30, 70, 80]

# Output
output_dir: "./output"
parquet_compression: "zstd"        # zstd or snappy

top_n_atomic_for_combine: 15
max_corr_combine: 0.85
max_atoms_per_combo: 5
include_ma_conditions: true        # enables the 5th family (MA) so 5-way combos are possible
