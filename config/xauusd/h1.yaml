# Pipeline Configuration for edge_research -- H1 profile
#
# ASSUMPTION THIS FILE IS BUILT ON: dataset size of roughly 16,500
# bars (~3 years of continuous H1, same historical window as the M1
# profile scaled down by the M1:H1 bar-count ratio of 60x). This is a
# ballpark, not your actual file size.
#
# ACTION REQUIRED BEFORE TRUSTING RESULTS FROM THIS PROFILE:
# After Phase 1 runs, check the log line:
#   "Ingestion complete: N bars loaded"
# If your actual N differs a lot from 16,500, rescale the three
# wf_* values below using the same ratio this file uses:
#   wf_train_bars  ~= 0.35 * N
#   wf_test_bars   ~= 0.07 * N
#   wf_step_bars   ~= 0.035 * N
# (this ratio produces multiple valid walk-forward windows (17, verified) on the real
# 4123-bar XAUUSD D1 smoke test -- see PROJECT_DIRECTION.md section 10)
# The pipeline now warns loudly at [PHASE 7] if wf_train_bars + wf_test_bars
# doesn't fit inside your actual bar count, so a bad guess here won't fail
# silently -- but rescaling correctly still gives more walk-forward windows
# and a more reliable robust_walk_forward signal than relying on the warning
# and having the gate reject everything.
#
# NOTE: at ~16,500 bars this dataset is getting close in size to the D1
# smoke-test dataset (4123 bars) that established the 0.35/0.07/0.035
# ratio. If your real H1 bar count comes in noticeably smaller than this
# assumption (e.g. less than ~2 years of history), walk-forward may only
# produce a handful of windows -- check the Phase 7 log for the actual
# window count and treat robust_walk_forward with extra caution if it's low.

# Forward-looking horizon parameters
max_horizon: 20                    # Maximum bars to look ahead (1 to 20)
min_horizon: 1                     # Minimum bars (always 1)

# Frequency filtering
# Scaled down to roughly the same order as the original D1 defaults, since
# H1 has 1/60 the bar count of M1 (and 24x the bar count of D1) over the
# same historical window.
min_occurrence: 50
min_freq_per_year: 10.0

# Statistical significance
alpha: 0.05                        # Significance level for hypothesis tests
fdr_method: "fdr_bh"               # Benjamini-Hochberg FDR correction

# Walk-forward validation -- sized for ~16,500 bars (~3 years of continuous H1).
# See the ACTION REQUIRED note above if your actual bar count is different.
wf_train_bars: 5775
wf_test_bars: 1155
wf_step_bars: 578

# Regime classification
atr_percentile_low: 25             # ATR < 25th percentile = low vol
atr_percentile_high: 75            # ATR > 75th percentile = high vol

adx_trending_threshold: 25         # ADX > 25 = trending regime
adx_ranging_threshold: 20          # ADX < 20 = ranging regime

# Parameter sensitivity
param_shift_pct: 15                # +/-15% parameter shift for sensitivity test

# Cost model (entry and exit) -- already set for XAUUSD, NOT forex defaults.
# spread_pips * pip_value = 30.0 * 0.01 = 0.3 price units, matching XAUUSD's
# real spread (per PROJECT_DIRECTION.md section 10). This is symbol-dependent,
# not timeframe-dependent, so it does NOT need to change across the M5/M15/
# M30/H1 profiles -- only change it if you switch symbols.
spread_pips: 30.0
slippage_pips: 1.0
pip_value: 0.01

# Holdout set
holdout_pct: 0.15                  # Reserve 15% of data as final untouched test set

# Trade simulation (Phase 7c)
# Same widened stop as the M5/M15/M30 profiles: keeps the 1:2 risk:reward
# ratio (33.3% breakeven win rate) while keeping timeframe the isolated
# variable under test across profiles.
sim_sl_atr_mult: 3.0
sim_tp_atr_mult: 6.0
sim_use_trailing_stop: false
sim_trail_atr_mult: 1.5
sim_atr_column: "atr_14"
sim_max_holding_bars: 60           # explicit override, not the max_horizon default
                                    # -- 60 H1 bars = 2.5 days, reasonable room
                                    # for a 6x ATR target on this timeframe

# Rotation permutation test (Phase 7d)
permutation_n: 500
# permutation_random_state: 42     # uncomment for reproducible runs

# Final strategy selection gate (Phase 7e)
gate_min_sim_trades: 30
gate_min_profit_factor: 1.1
gate_require_walk_forward: true
gate_require_permutation: true

# Condition generation
rsi_thresholds: [20, 25, 30, 35, 70, 75, 80]
cci_thresholds: [-100, -50, 50, 100]
mom_thresholds: [-5, 0, 5]
stoch_thresholds: [20, 30, 70, 80]

# Output
output_dir: "./output"
parquet_compression: "zstd"        # zstd or snappy

top_n_atomic_for_combine: 15
max_corr_combine: 0.85
max_atoms_per_combo: 5
include_ma_conditions: true        # enables the 5th family (MA) so 5-way combos are possible